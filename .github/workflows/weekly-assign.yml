name: Weekly Cleaning Duty Assignment

on:
  schedule:
    # Monday 10:00 AM AEDT / 9:00 AM AEST
    - cron: "0 23 * * 0"
    # Thursday 10:00 AM AEDT / 9:00 AM AEST
    - cron: "0 23 * * 3"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run assignment
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: node scripts/assign.js
