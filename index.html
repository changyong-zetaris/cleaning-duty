<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cleaning Duty Roulette</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #0d1117;
      --bg-soft: #161b22;
      --paper: rgba(22, 27, 34, 0.82);
      --paper-strong: rgba(33, 38, 45, 0.92);
      --line: rgba(240, 246, 252, 0.09);
      --line-strong: rgba(240, 246, 252, 0.16);
      --ink: #e6edf3;
      --ink-soft: #b6c2cf;
      --muted: #8b97a3;
      --accent: #58a6ff;
      --accent-strong: #388bfd;
      --accent-2: #a371f7;
      --accent-soft: rgba(88, 166, 255, 0.12);
      --warning: rgba(210, 153, 34, 0.14);
      --warning-line: rgba(210, 153, 34, 0.32);
      --danger: #f85149;
      --danger-soft: rgba(248, 81, 73, 0.12);
      --success: #3fb950;
      --red-bean: #ff7b72;
      --red-bean-soft: rgba(255, 123, 114, 0.14);
      --yellow-bean: #e3b341;
      --yellow-bean-soft: rgba(227, 179, 65, 0.14);
      --shadow: 0 24px 64px rgba(1, 4, 9, 0.5);
      --shadow-soft: 0 12px 28px rgba(1, 4, 9, 0.36);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 9px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(88, 166, 255, 0.14), transparent 26%),
        radial-gradient(circle at top right, rgba(163, 113, 247, 0.12), transparent 24%),
        linear-gradient(180deg, #0d1117 0%, #111923 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 34px 18px 48px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      opacity: 0.4;
      pointer-events: none;
    }

    .container {
      max-width: 1120px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: left;
      margin-bottom: 24px;
      padding: 18px 20px 0;
      display: grid;
      gap: 10px;
    }

    .header::after {
      content: '';
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(88, 166, 255, 0.22), rgba(139, 148, 158, 0.08), transparent 72%);
      margin-top: 2px;
    }

    .header .kicker,
    .header .date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .header h1 {
      font-size: clamp(2.4rem, 5vw, 3.2rem);
      line-height: 1.05;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.04em;
    }

    .header .subtitle {
      max-width: 760px;
      font-size: 1.02rem;
      line-height: 1.72;
      color: var(--ink-soft);
    }

    .notice-strip {
      background: linear-gradient(135deg, rgba(33, 38, 45, 0.9), rgba(22, 27, 34, 0.92));
      border: 1px solid var(--warning-line);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-soft);
    }

    .notice-strip.hidden { display: none; }

    .notice-strip .eyebrow {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #d29922;
      margin-bottom: 8px;
    }

    .notice-strip .message {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--ink);
    }

    .workspace-nav {
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      margin-bottom: 22px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow-soft);
    }

    .workspace-tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .workspace-tab-btn:hover {
      transform: translateY(-1px);
    }

    .workspace-tab-btn.active {
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(88, 166, 255, 0.12);
    }

    .page-panels {
      display: grid;
    }

    .page-panel {
      display: none;
      animation: fadeUp 0.24s ease both;
    }

    .page-panel.active {
      display: block;
    }

    .stack {
      display: grid;
      gap: 20px;
    }

    .stack > * {
      animation: fadeUp 0.5s ease both;
    }

    .stack > *:nth-child(2) { animation-delay: 0.05s; }
    .stack > *:nth-child(3) { animation-delay: 0.1s; }
    .stack > *:nth-child(4) { animation-delay: 0.15s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card,
    .slot-machine {
      background: var(--paper);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .slot-machine {
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .slot-machine::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(88, 166, 255, 0.12), transparent 28%),
        radial-gradient(circle at bottom left, rgba(163, 113, 247, 0.1), transparent 24%);
      pointer-events: none;
    }

    .hero-top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .hero-top .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: clamp(1.7rem, 2.6vw, 2.15rem);
      line-height: 1.15;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .hero-copy {
      max-width: 460px;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--ink-soft);
    }

    .hero-badge {
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.12);
      border: 1px solid rgba(88, 166, 255, 0.18);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
    }

    .cycle-info {
      position: relative;
      z-index: 1;
      font-size: 1rem;
      color: var(--ink-soft);
      margin-bottom: 16px;
      line-height: 1.75;
    }

    .cycle-info strong { color: var(--accent); }

    .pre-run-note {
      display: none;
      position: relative;
      z-index: 1;
      background: var(--warning);
      border: 1px solid var(--warning-line);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      margin-bottom: 16px;
      color: #d2a86b;
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .pre-run-note.visible { display: block; }

    .slot-windows {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .slot-window {
      min-width: 0;
      min-height: 188px;
      background: linear-gradient(180deg, rgba(33, 38, 45, 0.62), rgba(13, 17, 23, 0.62));
      border-radius: 18px;
      border: 1px solid var(--line);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      padding: 28px 18px 24px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .slot-window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--line-strong);
    }

    .slot-window.slot-red::before {
      background: linear-gradient(90deg, transparent, var(--red-bean), transparent);
    }

    .slot-window.slot-yellow::before {
      background: linear-gradient(90deg, transparent, var(--yellow-bean), transparent);
    }

    .slot-window .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: var(--muted);
    }

    .slot-window .name {
      font-size: clamp(1.5rem, 3vw, 1.95rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.01em;
      color: var(--ink);
      transition: color 0.25s ease, transform 0.25s ease;
      word-break: break-word;
    }

    .slot-window .name.spinning {
      animation: slotSpin 0.12s linear infinite;
      color: var(--muted);
      filter: blur(1.5px);
    }

    .slot-window .name.winner {
      color: var(--accent);
      animation: winPulse 0.45s ease;
    }

    .slot-window.slot-red .name.winner { color: var(--red-bean); }
    .slot-window.slot-yellow .name.winner { color: var(--yellow-bean); }

    .slot-window .task {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px 5px 10px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }

    .slot-window .task-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .slot-window.slot-red .task {
      color: var(--red-bean);
      background: var(--red-bean-soft);
      border-color: rgba(255, 123, 114, 0.3);
    }

    .slot-window.slot-red .task-dot { background: var(--red-bean); }

    .slot-window.slot-yellow .task {
      color: var(--yellow-bean);
      background: var(--yellow-bean-soft);
      border-color: rgba(227, 179, 65, 0.3);
    }

    .slot-window.slot-yellow .task-dot { background: var(--yellow-bean); }

    @keyframes slotSpin {
      0% { transform: translateY(-8px); opacity: 0.35; }
      50% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(8px); opacity: 0.35; }
    }

    @keyframes winPulse {
      0% { transform: scale(1.06); }
      50% { transform: scale(0.98); }
      100% { transform: scale(1); }
    }

    .pull-btn,
    .mini-btn,
    .icon-btn,
    .danger-btn {
      border: none;
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, opacity 0.18s ease;
    }

    .pull-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 16px 20px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, #1f6feb, #388bfd);
      box-shadow: 0 12px 24px rgba(31, 111, 235, 0.22);
    }

    .mini-btn {
      padding: 0 18px;
      min-height: 48px;
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
      color: #ffffff;
      background: linear-gradient(135deg, #1f6feb, #2f81f7);
      box-shadow: 0 8px 18px rgba(31, 111, 235, 0.18);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      line-height: 1;
    }

    .danger-btn {
      min-height: 42px;
      padding: 10px 18px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid rgba(248, 81, 73, 0.24);
      text-transform: uppercase;
      letter-spacing: 1.1px;
    }

    .danger-btn:hover {
      background: rgba(248, 81, 73, 0.18);
    }

    .pull-btn:hover,
    .mini-btn:hover,
    .icon-btn:hover,
    .danger-btn:hover {
      transform: translateY(-1px);
    }

    .pull-btn:disabled,
    .mini-btn:disabled,
    .icon-btn:disabled,
    .danger-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }

    .card {
      padding: 22px;
    }

    .management-card {
      overflow: hidden;
    }

    .management-shell {
      display: grid;
      gap: 18px;
    }

    .management-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .management-title {
      font-size: 1.5rem;
      line-height: 1.2;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .management-copy {
      color: var(--ink-soft);
      font-size: 0.94rem;
      line-height: 1.7;
      max-width: 280px;
    }

    .management-tabs {
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: fit-content;
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(88, 166, 255, 0.12);
    }

    .tab-panel {
      display: none;
      gap: 0;
    }

    .tab-panel.active {
      display: grid;
      animation: fadeUp 0.24s ease both;
    }

    .tab-panel-body {
      max-height: 620px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .tab-panel-body::-webkit-scrollbar {
      width: 8px;
    }

    .tab-panel-body::-webkit-scrollbar-thumb {
      background: rgba(88, 166, 255, 0.24);
      border-radius: 999px;
    }

    .card h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .card .section-copy {
      color: var(--ink-soft);
      font-size: 0.96rem;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .form-row,
    .double-row,
    .triple-row {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .form-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .double-row {
      grid-template-columns: 150px minmax(0, 1fr) auto;
    }

    .triple-row {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto;
    }

    .text-input,
    .date-input {
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(13, 17, 23, 0.72);
      color: var(--ink);
      padding: 12px 14px;
      border-radius: 14px;
      font: inherit;
      font-size: 0.95rem;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .text-input::placeholder,
    .date-input::placeholder {
      color: rgba(139, 148, 158, 0.68);
    }

    .text-input:focus,
    .date-input:focus {
      border-color: rgba(88, 166, 255, 0.32);
      box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.12);
    }

    .members {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(214px, 1fr));
      gap: 12px;
    }

    .member {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 122px;
      border-radius: var(--radius-lg);
      padding: 15px 16px 16px;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
      border: 1px solid var(--line);
      background: rgba(13, 17, 23, 0.46);
    }

    .member:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
    }

    .member-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .member-avatar {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #f0f6fc;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .member-avatar.avatar-c0 { background: linear-gradient(135deg, #1f6feb, #388bfd); border-color: transparent; }
    .member-avatar.avatar-c1 { background: linear-gradient(135deg, #8957e5, #a371f7); border-color: transparent; }
    .member-avatar.avatar-c2 { background: linear-gradient(135deg, #1f883d, #3fb950); border-color: transparent; }
    .member-avatar.avatar-c3 { background: linear-gradient(135deg, #c2541b, #f0883e); border-color: transparent; }
    .member-avatar.avatar-c4 { background: linear-gradient(135deg, #9e6a03, #e3b341); color: #0d1117; border-color: transparent; }
    .member-avatar.avatar-c5 { background: linear-gradient(135deg, #bf4b8a, #db61a2); border-color: transparent; }

    .member-status {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }

    .member-status.on-duty {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(88, 166, 255, 0.26);
    }

    .member .member-name {
      display: block;
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink);
      word-break: break-word;
    }

    .member .member-email {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      line-height: 1.5;
      color: var(--muted);
      word-break: break-word;
    }

    .member.selected {
      border-color: rgba(88, 166, 255, 0.3);
      background: linear-gradient(180deg, rgba(31, 111, 235, 0.12), rgba(13, 17, 23, 0.46));
    }

    .member.done {
      opacity: 0.6;
    }

    .member.done .member-name {
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      color: var(--ink-soft);
    }

    .member-remove {
      flex: none;
    }

    .pill-list {
      display: grid;
      gap: 10px;
    }

    .pill {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 14px 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(22, 27, 34, 0.72);
    }

    .pill-info {
      min-width: 0;
    }

    .pill-date {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      font-size: 0.76rem;
      margin-bottom: 5px;
    }

    .pill-name {
      font-weight: 700;
      color: var(--ink);
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .pill-meta {
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }

    .history-item:last-child { border-bottom: none; }

    .history-text {
      min-width: 0;
      flex: 1;
    }

    .history-item .date-round {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      font-size: 0.76rem;
      margin-bottom: 6px;
    }

    .history-item .names {

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
    import {
      getFirestore, doc, getDoc, setDoc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAi8ajdoo5U3sQiC5g2RaX1ajnjVg_kGyI",
      authDomain: "cleaning-duty-e268f.firebaseapp.com",
      projectId: "cleaning-duty-e268f",
      storageBucket: "cleaning-duty-e268f.firebasestorage.app",
      messagingSenderId: "748276836883",
      appId: "1:748276836883:web:a4d31fb124ed1f2816ede6"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);
    const stateRef = doc(db, "cleaning", "state");
    const configRef = doc(db, "cleaning", "config");

    const DEFAULT_STATE = { remaining: [], cycle: 0, history: [] };
    const DEFAULT_CONFIG = {
      members: [],
      holidayOverrides: { additions: [], exclusions: [] }
    };

    const MELBOURNE_TIMEZONE = "Australia/Melbourne";
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    let MEMBERS = [];
    let MEMBER_NAMES = [];
    let currentConfig = structuredClone(DEFAULT_CONFIG);
    let currentState = structuredClone(DEFAULT_STATE);
    let fullOpen = false;
    let initialized = false;
    let isSpinning = false;
    let configLoaded = false;
    let stateLoaded = false;
    let currentMainTab = "draw";
    let currentAdminTab = "candidates";
    let holidayApiCache = new Map();
    let holidayHelperMessage = "Loading Melbourne public holidays...";
    let isSavingConfig = false;
    let isSavingState = false;

    function showDate() {
      const el = document.getElementById("todayDate");
      if (el) el.textContent = formatDateString(getMelbourneToday());
    }

    function getMelbourneToday() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: MELBOURNE_TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function parseDateString(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      return { year, month, day };
    }

    function formatDate(value) {
      if (!value) return "";
      if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return formatDateString(value);
      }
      const d = typeof value === "string" ? new Date(value) : value;
      return `${dayNames[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatDateString(dateString) {
      const { year, month, day } = parseDateString(dateString);
      const utcDate = new Date(Date.UTC(year, month - 1, day));
      return `${dayNames[utcDate.getUTCDay()]}, ${day} ${monthNames[month - 1]} ${year}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function getInitials(name) {
      const parts = String(name).trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return "?";
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function addDays(dateString, days) {
      const { year, month, day } = parseDateString(dateString);
      const utcDate = new Date(Date.UTC(year, month - 1, day));
      utcDate.setUTCDate(utcDate.getUTCDate() + days);
      return toDateString(utcDate);
    }

    function toDateString(d) {
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
    }

    function getDayOfWeek(dateString) {
      const { year, month, day } = parseDateString(dateString);
      return new Date(Date.UTC(year, month - 1, day)).getUTCDay();
    }

    function uniqueNames(names) {
      const seen = new Set();
      return names.filter((name) => {
        if (!name || seen.has(name)) return false;
        seen.add(name);
        return true;
      });
    }

    function normalizeMembers(members) {
      if (!Array.isArray(members)) return [];
      return members
        .map((member) => {
          if (typeof member === "string") {
            const name = member.trim();
            return name ? { name, email: "" } : null;
          }

          const name = String(member?.name || "").trim();
          if (!name) return null;
          return {
            ...member,
            name,
            email: typeof member?.email === "string" ? member.email : ""
          };
        })
        .filter(Boolean)
        .filter((member, index, arr) => arr.findIndex((entry) => entry.name === member.name) === index);
    }

    function normalizeHolidayOverrides(holidayOverrides) {
      const additions = Array.isArray(holidayOverrides?.additions)
        ? holidayOverrides.additions
            .map((holiday) => ({
              date: String(holiday?.date || ""),
              name: String(holiday?.name || "").trim()
            }))
            .filter((holiday) => /^\d{4}-\d{2}-\d{2}$/.test(holiday.date) && holiday.name)
            .filter((holiday, index, arr) => arr.findIndex((entry) => entry.date === holiday.date) === index)
        : [];

      const exclusions = Array.isArray(holidayOverrides?.exclusions)
        ? uniqueNames(holidayOverrides.exclusions.map((date) => String(date || "").trim()).filter((date) => /^\d{4}-\d{2}-\d{2}$/.test(date)))
        : [];

      return { additions, exclusions };
    }

    function normalizeConfig(config) {
      return {
        members: normalizeMembers(config?.members),
        holidayOverrides: normalizeHolidayOverrides(config?.holidayOverrides)
      };
    }

    function createHistoryId() {
      if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
      return `history-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function normalizeHistory(history) {
      if (!Array.isArray(history)) return [];
      return history.map((entry, index) => ({
        ...entry,
        id: entry?.id || `legacy-${index}-${entry?.date || "unknown"}`,
        assigned: Array.isArray(entry?.assigned) ? entry.assigned.filter(Boolean) : [],
        date: entry?.date || "",
        scheduledFor: entry?.scheduledFor || entry?.date || "",
        advancedForHoliday: Boolean(entry?.advancedForHoliday),
        holidayName: entry?.holidayName || "",
        holidayDate: entry?.holidayDate || "",
        round: Number(entry?.round || 0),
        cycle: Number(entry?.cycle || 0)
      }));
    }

    function getCurrentCycleCount(history, cycle) {
      return history.filter((entry) => entry.cycle === cycle).length;
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function reconcileStateWithMembers(state, memberNames) {
      const history = normalizeHistory(state?.history);
      const cycle = Number(state?.cycle || 0);
      const currentCycleAssigned = new Set(
        history
          .filter((entry) => entry.cycle === cycle)
          .flatMap((entry) => entry.assigned)
          .filter((name) => memberNames.includes(name))
      );

      const dedupedRemaining = uniqueNames(
        Array.isArray(state?.remaining)
          ? state.remaining.filter((name) => memberNames.includes(name))
          : []
      ).filter((name) => !currentCycleAssigned.has(name));

      const missingRemaining = memberNames.filter((name) => !currentCycleAssigned.has(name) && !dedupedRemaining.includes(name));

      return {
        cycle,
        history,
        remaining: [...dedupedRemaining, ...shuffle(missingRemaining)]
      };
    }

    function rebuildStateFromHistory(history, memberNames) {
      const normalizedHistory = normalizeHistory(history);
      if (normalizedHistory.length === 0) {
        return structuredClone(DEFAULT_STATE);
      }

      let cycle = 0;
      let round = 0;
      let assignedInCycle = new Set();
      const nextHistory = [];

      normalizedHistory.forEach((entry) => {
        const relevantAssigned = entry.assigned.filter((name) => memberNames.includes(name));
        const availableCount = memberNames.filter((name) => !assignedInCycle.has(name)).length;
        const startsNewCycle =
          cycle === 0 ||
          relevantAssigned.some((name) => assignedInCycle.has(name)) ||
          availableCount < Math.max(relevantAssigned.length, 2);

        if (startsNewCycle) {
          cycle += 1;
          round = 0;
          assignedInCycle = new Set();
        }

        round += 1;
        relevantAssigned.forEach((name) => assignedInCycle.add(name));

        nextHistory.push({
          ...entry,
          id: entry.id || createHistoryId(),
          cycle,
          round
        });
      });

      return {
        cycle,
        history: nextHistory,
        remaining: memberNames.filter((name) => !assignedInCycle.has(name))
      };
    }

    async function fetchApiHolidaysForYears(years) {
      const uniqueYears = [...new Set(years)];
      const missingYears = uniqueYears.filter((year) => !holidayApiCache.has(year));

      if (missingYears.length > 0) {
        await Promise.all(missingYears.map(async (year) => {
          try {
            const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/AU`);
            if (!response.ok) throw new Error(`Holiday API returned ${response.status}`);
            const data = await response.json();
            holidayApiCache.set(year, data);
          } catch (error) {
            console.error("Failed to fetch holidays:", error);
            holidayApiCache.set(year, { error: error.message, items: [] });
          }
        }));
      }

      const apiEntries = [];
      const errors = [];

      uniqueYears.forEach((year) => {
        const cached = holidayApiCache.get(year);
        const items = Array.isArray(cached) ? cached : cached?.items || [];

        if (!Array.isArray(cached) && cached?.error) {
          errors.push(cached.error);
          return;
        }

        items
          .filter((holiday) => holiday.counties === null || holiday.counties.includes("AU-VIC"))
          .forEach((holiday) => {
            apiEntries.push({
              date: holiday.date,
              name: holiday.localName || holiday.name,
              hasApiSource: true,
              hasCustomSource: false
            });
          });
      });

      holidayHelperMessage = errors.length > 0
        ? "Holiday API is temporarily unavailable. Custom holidays still work."
        : "Official Victoria holidays are synced automatically, and you can override them below.";

      return apiEntries;
    }

    function getEffectiveHolidays(config, apiEntries) {
      const overrides = normalizeHolidayOverrides(config?.holidayOverrides);
      const holidayMap = new Map();

      apiEntries.forEach((holiday) => {
        if (overrides.exclusions.includes(holiday.date)) return;
        holidayMap.set(holiday.date, { ...holiday });
      });

      overrides.additions.forEach((holiday) => {
        const existing = holidayMap.get(holiday.date);
        holidayMap.set(holiday.date, {
          date: holiday.date,
          name: holiday.name,
          hasApiSource: Boolean(existing?.hasApiSource),
          hasCustomSource: true
        });
      });

      return [...holidayMap.values()].sort((a, b) => a.date.localeCompare(b.date));
    }

    function getHolidayMap(holidays) {
      return new Map(holidays.map((holiday) => [holiday.date, holiday]));
    }

    function getCachedApiHolidayEntries() {
      return [...holidayApiCache.values()]
        .flatMap((entry) => Array.isArray(entry) ? entry : [])
        .filter((holiday) => holiday.counties === null || holiday.counties?.includes("AU-VIC"))
        .map((holiday) => ({
          date: holiday.date,
          name: holiday.localName || holiday.name,
          hasApiSource: true,
          hasCustomSource: false
        }));
    }

    function getUpcomingScheduleNotice(holidays) {
      const holidayMap = getHolidayMap(holidays);
      const today = getMelbourneToday();
      const dayOfWeek = getDayOfWeek(today);
      const nextMondayOffset = dayOfWeek === 1 ? 7 : (8 - dayOfWeek) % 7 || 7;
      const nextMonday = addDays(today, nextMondayOffset);
      const mondayHoliday = holidayMap.get(nextMonday);

      if (mondayHoliday) {
        const previousThursday = addDays(nextMonday, -4);
        return `Next automatic run moves to ${formatDateString(previousThursday)} because ${formatDateString(nextMonday)} is ${mondayHoliday.name}.`;
      }

      return `Next automatic run is on ${formatDateString(nextMonday)} unless that Monday is marked as a holiday.`;
    }

    function renderScheduleBanner(state, holidays) {
      const banner = document.getElementById("scheduleBanner");
      const message = document.getElementById("scheduleBannerMessage");
      const latest = state.history.at(-1);

      let text = "";
      if (latest?.advancedForHoliday && latest?.holidayDate) {
        text = `This round was drawn early on ${formatDate(latest.date)} because ${formatDate(latest.holidayDate)} is ${latest.holidayName || "a holiday"}.`;
      } else {
        text = getUpcomingScheduleNotice(holidays);
      }

      if (!text) {
        banner.classList.add("hidden");
        message.textContent = "";
        return;
      }

      banner.classList.remove("hidden");
      message.textContent = text;
    }

    function renderPreRunNote(current) {
      const noteEl = document.getElementById("preRunNote");
      if (!current?.advancedForHoliday || !current?.holidayDate) {
        noteEl.className = "pre-run-note";
        noteEl.textContent = "";
        return;
      }

      noteEl.className = "pre-run-note visible";
      noteEl.textContent = `Drawn early on ${formatDate(current.date)} — because ${formatDate(current.holidayDate)} is ${current.holidayName || "a holiday"}, the draw ran on Thursday instead of the usual Monday.`;
    }

    async function ensureHolidayData() {
      const today = getMelbourneToday();
      const year = Number(today.slice(0, 4));
      const years = [year, year + 1];
      const apiEntries = await fetchApiHolidaysForYears(years);
      renderCurrent();
      return apiEntries;
    }

    function ensureAppShell() {
      if (initialized) return;
      document.getElementById("app").innerHTML = document.getElementById("mainTemplate").innerHTML;
      initialized = true;
      showDate();
    }

    function renderCurrent() {
      if (!initialized || !configLoaded || !stateLoaded || isSpinning) return;
      render(reconcileStateWithMembers(currentState, MEMBER_NAMES));
    }

    function renderMainTabs() {
      const isDraw = currentMainTab === "draw";
      const isHistory = currentMainTab === "history";
      const isManage = currentMainTab === "manage";
      const drawBtn = document.getElementById("drawTabBtn");
      const historyBtn = document.getElementById("historyTabBtn");
      const manageBtn = document.getElementById("manageTabBtn");
      const drawPage = document.getElementById("drawPage");
      const historyPage = document.getElementById("historyPage");
      const managePage = document.getElementById("managePage");

      if (!drawBtn || !historyBtn || !manageBtn || !drawPage || !historyPage || !managePage) return;

      drawBtn.classList.toggle("active", isDraw);
      historyBtn.classList.toggle("active", isHistory);
      manageBtn.classList.toggle("active", isManage);
      drawBtn.setAttribute("aria-selected", String(isDraw));
      historyBtn.setAttribute("aria-selected", String(isHistory));
      manageBtn.setAttribute("aria-selected", String(isManage));
      drawPage.classList.toggle("active", isDraw);
      historyPage.classList.toggle("active", isHistory);
      managePage.classList.toggle("active", isManage);
    }

    function renderAdminTabs() {
      const isCandidates = currentAdminTab === "candidates";
      const candidatesBtn = document.getElementById("candidatesTabBtn");
      const holidaysBtn = document.getElementById("holidaysTabBtn");
      const candidatesPanel = document.getElementById("candidatesPanel");
      const holidaysPanel = document.getElementById("holidaysPanel");

      if (!candidatesBtn || !holidaysBtn || !candidatesPanel || !holidaysPanel) return;

      candidatesBtn.classList.toggle("active", isCandidates);
      holidaysBtn.classList.toggle("active", !isCandidates);
      candidatesBtn.setAttribute("aria-selected", String(isCandidates));
      holidaysBtn.setAttribute("aria-selected", String(!isCandidates));
      candidatesPanel.classList.toggle("active", isCandidates);
      holidaysPanel.classList.toggle("active", !isCandidates);
    }

    async function init() {
      ensureAppShell();

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        if (event.target?.id === "memberNameInput" || event.target?.id === "memberEmailInput") {
          event.preventDefault();
          window.addMember();
        }
        if (event.target?.id === "holidayNameInput" || event.target?.id === "holidayDateInput") {
          event.preventDefault();
          window.addHoliday();
        }
      });

      onSnapshot(configRef, async (snapshot) => {
        currentConfig = normalizeConfig(snapshot.exists() ? snapshot.data() : DEFAULT_CONFIG);
        MEMBERS = currentConfig.members;
        MEMBER_NAMES = MEMBERS.map((member) => member.name);
        configLoaded = true;
        await ensureHolidayData();
        renderCurrent();
      }, (error) => {
        console.error("Failed to load config:", error);
        document.getElementById("app").innerHTML = '<div class="loading">Failed to load config. Check console for details.</div>';
      });

      onSnapshot(stateRef, (snapshot) => {
        currentState = snapshot.exists() ? snapshot.data() : structuredClone(DEFAULT_STATE);
        stateLoaded = true;
        renderCurrent();
      }, (error) => {
        console.error("Failed to load state:", error);
        document.getElementById("app").innerHTML = '<div class="loading">Failed to load state. Check console for details.</div>';
      });
    }

    init();

    function spinSlots(pick1, pick2) {
      return new Promise((resolve) => {
        isSpinning = true;
        const slot1 = document.getElementById("slot1");
        const slot2 = document.getElementById("slot2");

        slot1.className = "name spinning";
        slot2.className = "name spinning";

        let spinCount = 0;
        const spinInterval = setInterval(() => {
          slot1.textContent = MEMBER_NAMES[Math.floor(Math.random() * MEMBER_NAMES.length)] || "?";
          slot2.textContent = MEMBER_NAMES[Math.floor(Math.random() * MEMBER_NAMES.length)] || "?";
          spinCount += 1;

          if (spinCount > 20) {
            clearInterval(spinInterval);

            let slow1 = 0;
            const slowInterval1 = setInterval(() => {
              slot1.textContent = MEMBER_NAMES[Math.floor(Math.random() * MEMBER_NAMES.length)] || "?";
              slow1 += 1;
              if (slow1 > 5) {
                clearInterval(slowInterval1);
                slot1.textContent = pick1;
                slot1.className = "name winner";

                let slow2 = 0;
                const slowInterval2 = setInterval(() => {
                  slot2.textContent = MEMBER_NAMES[Math.floor(Math.random() * MEMBER_NAMES.length)] || "?";
                  slow2 += 1;
                  if (slow2 > 5) {
                    clearInterval(slowInterval2);
                    slot2.textContent = pick2;
                    slot2.className = "name winner";
                    launchConfetti();
                    isSpinning = false;
                    resolve();
                  }
                }, 150);
              }
            }, 150);
          }
        }, 60);
      });
    }

    function launchConfetti() {
      const colors = ["#58a6ff", "#79c0ff", "#a371f7", "#3fb950", "#d29922", "#8b949e"];
      for (let i = 0; i < 24; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.top = "-10px";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = `${Math.random() * 0.5}s`;
        piece.style.animationDuration = `${1 + Math.random()}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2500);
      }
    }

    async function saveConfig(nextConfig) {
      isSavingConfig = true;
      try {
        await setDoc(configRef, normalizeConfig(nextConfig));
      } finally {
        isSavingConfig = false;
      }
    }

    async function saveState(nextState) {
      isSavingState = true;
      try {
        await setDoc(stateRef, {
          cycle: Number(nextState.cycle || 0),
          remaining: Array.isArray(nextState.remaining) ? nextState.remaining : [],
          history: normalizeHistory(nextState.history)
        });
      } finally {
        isSavingState = false;
      }
    }

    function setButtonBusy(buttonId, isBusy, busyLabel) {
      const button = document.getElementById(buttonId);
      if (!button) return;

      if (!button.dataset.defaultLabel) {
        button.dataset.defaultLabel = button.textContent;
      }

      button.disabled = isBusy;
      button.textContent = isBusy ? busyLabel : button.dataset.defaultLabel;
    }

    window.doAssign = async function () {
      if (isSpinning) return;
      const state = reconcileStateWithMembers(currentState, MEMBER_NAMES);

      if (MEMBER_NAMES.length < 2) {
        alert("Add at least two candidates before running the roulette.");
        return;
      }

      if (state.remaining.length < 2) {
        state.cycle = (state.cycle || 0) + 1;
        state.remaining = shuffle(MEMBER_NAMES);
      }

      const idx1 = Math.floor(Math.random() * state.remaining.length);
      const pick1 = state.remaining.splice(idx1, 1)[0];
      const idx2 = Math.floor(Math.random() * state.remaining.length);
      const pick2 = state.remaining.splice(idx2, 1)[0];
      const today = getMelbourneToday();
      const roundNum = getCurrentCycleCount(state.history, state.cycle) + 1;

      const nextState = {
        ...state,
        history: [
          ...state.history,
          {
            id: createHistoryId(),
            cycle: state.cycle,
            round: roundNum,
            assigned: [pick1, pick2],
            date: today,
            scheduledFor: today,
            advancedForHoliday: false,
            holidayName: "",
            holidayDate: ""
          }
        ]
      };

      document.getElementById("assignBtn").disabled = true;
      await spinSlots(pick1, pick2);
      await saveState(nextState);
      document.getElementById("assignBtn").disabled = false;
      render(nextState);
    };

    window.doReset = async function () {
      if (!confirm("Reset all history and current cycle?")) return;
      await saveState(structuredClone(DEFAULT_STATE));
    };

    window.toggleFull = function () {
      fullOpen = !fullOpen;
      document.getElementById("fullHistory").style.display = fullOpen ? "block" : "none";
      document.getElementById("arrow").className = `arrow${fullOpen ? " open" : ""}`;
      if (fullOpen) renderFullHistory(reconcileStateWithMembers(currentState, MEMBER_NAMES));
    };

    window.switchMainTab = function (tab) {
      currentMainTab = tab === "history" || tab === "manage" ? tab : "draw";
      renderMainTabs();
    };

    window.switchAdminTab = function (tab) {
      currentAdminTab = tab === "holidays" ? "holidays" : "candidates";
      renderAdminTabs();
    };

    window.addMember = async function () {
      if (isSavingConfig || isSavingState) return;
      const nameInput = document.getElementById("memberNameInput");
      const emailInput = document.getElementById("memberEmailInput");
      const name = nameInput.value.trim();
      const email = emailInput.value.trim().toLowerCase();
      if (!name) return;
      if (!email) {
        alert("Enter the candidate email too.");
        emailInput.focus();
        return;
      }
      if (MEMBER_NAMES.includes(name)) {
        alert("That candidate already exists.");
        return;
      }
      if (MEMBERS.some((member) => member.email?.toLowerCase() === email)) {
        alert("That email already exists.");
        return;
      }

      const nextMembers = [...MEMBERS, { name, email }];
      const nextState = reconcileStateWithMembers(currentState, nextMembers.map((member) => member.name));

      setButtonBusy("addMemberBtn", true, "Adding...");
      nameInput.disabled = true;
      emailInput.disabled = true;

      try {
        await saveConfig({ ...currentConfig, members: nextMembers });
        await saveState(nextState);
        nameInput.value = "";
        emailInput.value = "";
      } catch (error) {
        console.error("Failed to add candidate:", error);
        alert("Failed to add candidate. Check Firestore permissions or your browser console.");
      } finally {
        nameInput.disabled = false;
        emailInput.disabled = false;
        setButtonBusy("addMemberBtn", false, "Adding...");
        nameInput.focus();
      }
    };

    window.removeMember = async function (name) {
      if (!confirm(`Remove ${name} from the candidate list?`)) return;
      const nextMembers = MEMBERS.filter((member) => member.name !== name);
      const nextState = reconcileStateWithMembers(currentState, nextMembers.map((member) => member.name));
      await saveConfig({ ...currentConfig, members: nextMembers });
      await saveState(nextState);
    };

    window.addHoliday = async function () {
      if (isSavingConfig) return;
      const dateInput = document.getElementById("holidayDateInput");
      const nameInput = document.getElementById("holidayNameInput");
      const date = dateInput.value;
      const name = nameInput.value.trim();

      if (!date || !name) {
        alert("Enter both a date and a holiday name.");
        return;
      }

      setButtonBusy("addHolidayBtn", true, "Adding...");
      dateInput.disabled = true;
      nameInput.disabled = true;

      try {
        const overrides = normalizeHolidayOverrides(currentConfig.holidayOverrides);
        const nextAdditions = [
          ...overrides.additions.filter((holiday) => holiday.date !== date),
          { date, name }
        ].sort((a, b) => a.date.localeCompare(b.date));

        const nextExclusions = overrides.exclusions.filter((excludedDate) => excludedDate !== date);
        await saveConfig({
          ...currentConfig,
          holidayOverrides: {
            additions: nextAdditions,
            exclusions: nextExclusions
          }
        });

        dateInput.value = "";
        nameInput.value = "";
      } catch (error) {
        console.error("Failed to add holiday:", error);
        alert("Failed to add holiday. Check Firestore permissions or your browser console.");
      } finally {
        dateInput.disabled = false;
        nameInput.disabled = false;
        setButtonBusy("addHolidayBtn", false, "Adding...");
      }
    };

    window.removeHoliday = async function (date) {
      const holidays = getEffectiveHolidays(currentConfig, await fetchApiHolidaysForYears([Number(date.slice(0, 4))]));
      const target = holidays.find((holiday) => holiday.date === date);
      if (!target) return;

      const overrides = normalizeHolidayOverrides(currentConfig.holidayOverrides);
      await saveConfig({
        ...currentConfig,
        holidayOverrides: {
          additions: overrides.additions.filter((holiday) => holiday.date !== date),
          exclusions: target.hasApiSource
            ? uniqueNames([...overrides.exclusions, date])
            : overrides.exclusions
        }
      });
    };

    window.deleteHistoryItem = async function (index) {
      if (!confirm("Delete this history entry?")) return;
      const state = reconcileStateWithMembers(currentState, MEMBER_NAMES);
      const nextHistory = state.history.filter((_, historyIndex) => historyIndex !== index);
      await saveState(rebuildStateFromHistory(nextHistory, MEMBER_NAMES));
    };

    function render(state) {
      const holidays = getEffectiveHolidays(currentConfig, getCachedApiHolidayEntries());
      const current = state.history.length > 0 ? state.history[state.history.length - 1] : null;
      const currentAssigned = current ? current.assigned : [];
      const remainingSet = new Set(state.remaining);

      renderScheduleBanner(state, holidays);
      renderPreRunNote(current);
      renderMainTabs();
      renderAdminTabs();

      const slot1 = document.getElementById("slot1");
      const slot2 = document.getElementById("slot2");
      if (current && !isSpinning) {
        slot1.textContent = current.assigned[0] || "?";
        slot1.className = "name winner";
        slot2.textContent = current.assigned[1] || "?";
        slot2.className = "name winner";
      } else if (!current) {
        slot1.textContent = "?";
        slot1.className = "name";
        slot2.textContent = "?";
        slot2.className = "name";
      }

      document.getElementById("membersGrid").innerHTML = MEMBERS.length === 0
        ? '<div class="empty">No candidates yet</div>'
        : MEMBERS.map((member, memberIndex) => {
            const name = member.name;
            let cls = "member ";
            let statusCls = "in-rotation";
            let statusLabel = "In rotation";
            if (currentAssigned.includes(name)) {
              cls += "selected";
              statusCls = "on-duty";
              statusLabel = "On duty";
            } else if (remainingSet.has(name)) {
              cls += "available";
            } else if (state.cycle > 0) {
              cls += "done";
              statusCls = "done";
              statusLabel = "Done";
            } else {
              cls += "available";
            }

            const encodedName = encodeURIComponent(name);
            const safeName = escapeHtml(name);
            const safeEmail = escapeHtml(member.email || "");
            const initials = escapeHtml(getInitials(name));

            return `<div class="${cls}">
              <div class="member-top">
                <span class="member-avatar avatar-c${memberIndex % 6}" aria-hidden="true">${initials}</span>
                <span class="member-status ${statusCls}">${statusLabel}</span>
                <button class="icon-btn member-remove" onclick="removeMember(decodeURIComponent('${encodedName}'))" aria-label="Remove ${safeName}">&times;</button>
              </div>
              <span class="member-name">${safeName}</span>
              ${safeEmail ? `<span class="member-email">${safeEmail}</span>` : ""}
            </div>`;
          }).join("");

      const info = document.getElementById("cycleInfo");
      if (MEMBER_NAMES.length < 2) {
        info.innerHTML = "Add at least <strong>2 candidates</strong> to start the roulette.";
      } else if (state.cycle === 0) {
        info.innerHTML = "Pull the lever to find this round's lucky cleaners!";
      } else {
        const left = state.remaining.length;
        const roundsLeft = Math.floor(left / 2);
        info.innerHTML = `Cycle <strong>#${state.cycle}</strong> &middot; ${left < 2 ? "Current cycle is almost done — the next draw starts a new cycle." : `${roundsLeft} round${roundsLeft === 1 ? "" : "s"} remaining`}`;
      }

      const cycleItems = state.history
        .map((entry, index) => ({ ...entry, historyIndex: index }))
        .filter((entry) => entry.cycle === state.cycle);
      const cycleEl = document.getElementById("cycleHistory");

      if (cycleItems.length === 0) {
        cycleEl.innerHTML = '<div class="empty">No assignments yet</div>';
      } else {
        cycleEl.innerHTML = cycleItems.map((entry, index) => {
          const isCurrent = index === cycleItems.length - 1;
          const note = entry.advancedForHoliday && entry.holidayDate
            ? `<span class="history-note">Ran early on ${escapeHtml(formatDate(entry.date))} because ${escapeHtml(formatDate(entry.holidayDate))} is ${escapeHtml(entry.holidayName || "a holiday")}.</span>`
            : "";
          return `<div class="history-item${isCurrent ? " current" : ""}">
            <div class="history-text">
              <span class="date-round">${escapeHtml(formatDate(entry.date))} &middot; R${entry.round}</span>
              <span class="names">${escapeHtml(entry.assigned[0] || "?")} & ${escapeHtml(entry.assigned[1] || "?")}</span>
              ${note}
            </div>
            <button class="icon-btn" onclick="deleteHistoryItem(${entry.historyIndex})" aria-label="Delete history item">x</button>
          </div>`;
        }).join("");
      }

      document.getElementById("holidayHelper").textContent = holidayHelperMessage;
      const holidaysList = document.getElementById("holidaysList");
      holidaysList.innerHTML = holidays.length === 0
        ? '<div class="empty">No holidays configured</div>'
        : holidays.map((holiday) => {
            const sourceLabel = holiday.hasApiSource && holiday.hasCustomSource
              ? "Official + custom"
              : holiday.hasCustomSource
                ? "Custom office holiday"
                : "Official Victoria holiday";
            return `<div class="pill">
              <div class="pill-info">
                <div class="pill-date">${escapeHtml(holiday.date)}</div>
                <div class="pill-name">${escapeHtml(holiday.name)}</div>
                <div class="pill-meta">${escapeHtml(sourceLabel)}</div>
              </div>
              <button class="icon-btn" onclick='removeHoliday(${JSON.stringify(holiday.date)})' aria-label="Remove holiday">x</button>
            </div>`;
          }).join("");

      if (fullOpen) renderFullHistory(state);
    }

    function renderFullHistory(state) {
      const container = document.getElementById("fullHistory");
      if (state.history.length === 0) {
        container.innerHTML = '<div class="empty">No history yet</div>';
        return;
      }

      let html = "";
      let currentCycle = null;

      state.history.forEach((entry, index) => {
        if (entry.cycle !== currentCycle) {
          currentCycle = entry.cycle;
          html += `<div class="cycle-label">Cycle #${currentCycle}</div>`;
        }

        const note = entry.advancedForHoliday && entry.holidayDate
          ? `<span class="history-note">Executed early because ${escapeHtml(formatDate(entry.holidayDate))} is ${escapeHtml(entry.holidayName || "a holiday")}.</span>`
          : "";

        html += `<div class="history-item">
          <div class="history-text">
            <span class="date-round">${escapeHtml(formatDate(entry.date))} &middot; R${entry.round}</span>
            <span class="names">${escapeHtml(entry.assigned[0] || "?")} & ${escapeHtml(entry.assigned[1] || "?")}</span>
            ${note}
          </div>
          <button class="icon-btn" onclick="deleteHistoryItem(${index})" aria-label="Delete history item">x</button>
        </div>`;
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
